services:
  runner:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8090"
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:?Set a random token of at least 32 characters}
      SANDBOX_DATA_DIR: /srv/sigmagpt-sandboxes
      SANDBOX_NODE_IMAGE: ${SANDBOX_NODE_IMAGE:?Pin an approved Node image tag or digest}
      SANDBOX_PUBLIC_ORIGIN: ${SANDBOX_PUBLIC_ORIGIN:?Set the dedicated HTTPS preview origin}
      SANDBOX_FRAME_ORIGINS: ${SANDBOX_FRAME_ORIGINS:?Set the SigmaGPT frontend origin}
      SANDBOX_BUILD_NETWORK: sigmagpt-build-egress
      SANDBOX_PREVIEW_NETWORK: sigmagpt-preview-internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/sigmagpt-sandboxes:/srv/sigmagpt-sandboxes
    ports:
      - "${SANDBOX_BIND_IP:-127.0.0.1}:8090:8090"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      default: {}
      build-egress:
        aliases:
          - sandbox-runner

networks:
  build-egress:
    external: true
    name: sigmagpt-build-egress
